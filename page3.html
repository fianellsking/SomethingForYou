<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e5f5">
    <title>Our Special Story 💜❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="fx.css">
    <link rel="stylesheet" href="page3.css">

    <script src="fx.js"></script>
</head>
<body>

    <!-- ส่วนที่ 1: ส่วนต้อนรับด้านบน -->
    <header class="header-section reveal">
        <div class="badge">Happy Birthday My Princess 👑</div>
        <h1>💜 เรื่องราวและความทรงจำของเรา ❤️</h1>
        <p class="subtitle">ขอบคุณทุกช่วงเวลาที่หนูมาอยู่กับพี่</p>
        <div class="scroll-cue" aria-hidden="true">⌄</div>
    </header>


    <!-- ส่วนที่ 2: แกลเลอรีรูปภาพ (การ์ดสร้างจาก MEMORIES ใน page3.js) -->
    <section class="gallery-section">
        <h2 class="section-title reveal"><span>📸</span> Moments with You</h2>
        <div class="photo-grid" id="photo-grid"></div>
    </section>


    <!-- ส่วนที่ 3: ซองจดหมาย + ล็อค 2 ชั้น -->
    <section class="letter-section" id="letter-section">

        <h2 class="section-title reveal"><span>💌</span> จดหมายจากพี่ 😎</h2>
        <p class="letter-hint reveal" id="letter-hint">พี่ล็อคไว้สองชั้นนะ... ดูสิจะไขด้ายอ้ะเป่าาา</p>

        <div class="envelope-wrap reveal" id="envelope-wrap">

            <!-- ซองจดหมาย -->
            <div class="envelope" id="envelope">
                <div class="env-back"></div>

                <div class="env-paper" id="env-paper">
                    <span class="env-paper-to">💌 ถึงคนเก่งของเค้า</span>
                    <i></i><i></i><i></i>
                </div>

                <div class="env-front"></div>
                <div class="env-flap" id="env-flap"></div>
                <div class="env-seal" id="env-seal">💗</div>
            </div>

            <!-- 🔑 ล็อคชั้นที่ 1: วันแรกที่คบกัน -->
            <div class="lock-layer show" id="lock-1">
                <div class="heart-padlock" id="padlock">
                    <div class="shackle"></div>
                    <div class="lock-body">💖</div>
                </div>

                <h3>เอ้ะเหมือนว่าต้องใส่วันแรกที่คบกันรึเปล่านะ 💕</h3>
                <p class="lock-sub">วัน / เดือน / ปี</p>

                <div class="pin-container-2" id="anniversary-pin-container"></div>

                <p id="lock1-msg" class="lock-msg"></p>
            </div>

            <!-- ❓ ล็อคชั้นที่ 2: คำถามเลือกตอบ -->
            <div class="lock-layer" id="lock-2">
                <div class="quiz-badge">ติดอีกชั้นนึง! 🗝️</div>
                <p class="quiz-question" id="quiz-question"></p>
                <div class="quiz-options" id="quiz-options"></div>
                <p id="quiz-msg" class="quiz-msg"></p>
            </div>

        </div>


        <!-- 📜 แผ่นจดหมายจริง (โชว์หลังปลดล็อคครบ) -->
        <article class="letter-sheet" id="letter-sheet" hidden>
            <div class="sheet-stamp">💌</div>
            <h2 class="sheet-to" id="sheet-to"></h2>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="sheet-sign" id="sheet-sign"></div>
            <button class="skip-type" id="skip-type" type="button">ข้ามการพิมพ์ ⏩</button>
        </article>

    </section>


    <!-- ปุ่มไปต่อ / ย้อนกลับ -->
    <div class="footer-nav" id="footer-nav">
        <button class="fx-btn next-btn" id="next-btn" type="button" hidden>???...??? 🎂</button>
        <button class="back-btn" id="back-btn" type="button">🌸 ย้อนกลับไปหน้าแรก</button>
    </div>


    <!-- Modal อัลบั้มรูป (รูปสร้างจาก MEMORIES ใน page3.js) -->
    <div id="imageModal" class="modal" aria-hidden="true">
        <button class="close-btn" id="modal-close" aria-label="ปิด">&times;</button>

        <div class="modal-content">
            <h3 id="modalTitle"></h3>

            <div class="modal-photo" id="modalPhoto">
                <img id="modalImg" src="" alt="" draggable="false">
                <button class="lb-arrow prev" id="lb-prev" aria-label="รูปก่อนหน้า">‹</button>
                <button class="lb-arrow next" id="lb-next" aria-label="รูปถัดไป">›</button>
                <span class="modal-count" id="modalCount"></span>
            </div>

            <div class="thumbs" id="thumbs"></div>
        </div>
    </div>

    <script src="page3.js"></script>
</body>
</html>
